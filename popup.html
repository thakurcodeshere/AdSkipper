<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; width: 280px; text-align: center; margin: 0; }
    h2 { margin-top: 0; color: #ff0000; margin-bottom: 5px; }
    .stats { background: #f8f9fa; border-radius: 8px; padding: 12px; margin-top: 15px; border: 1px solid #e9ecef; }
    .stats h3 { margin: 0; font-size: 28px; color: #333; }
    .stats p { margin: 0; font-size: 13px; color: #666; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .toggle { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; }
    button { padding: 10px 16px; cursor: pointer; border: none; border-radius: 6px; background: #28a745; color: white; font-weight: bold; width: 100%; transition: 0.2s; }
    button:hover { filter: brightness(1.1); }
    button.disabled { background: #dc3545; }
    .history { text-align: left; margin-top: 15px; max-height: 160px; overflow-y: auto; overflow-x: hidden; font-size: 12px; border-top: 1px solid #eee; padding-top: 10px; }
    .history::-webkit-scrollbar { width: 4px; }
    .history::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    .history-item { padding: 6px 0; border-bottom: 1px dashed #eee; display: flex; justify-content: space-between; align-items: center; }
    .history-type { font-weight: bold; color: #ff0000; }
    .history-time { color: #888; font-size: 10px; background: #f1f3f5; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>AdSkipper</h2>
  
  <div class="stats">
    <h3 id="skipCount">0</h3>
    <p>Total Ads Skipped</p>
  </div>

  <div class="toggle">
    <button id="toggleBtn">Enabled</button>
  </div>

  <div class="history" id="historyList">
    <div style="text-align:center; color:#999; padding: 20px 0;">Loading activity...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
